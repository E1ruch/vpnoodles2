version: '3.8'

services:
  app:
    build: .
    container_name: vpnoodles-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
      # Веб-админка. Только на localhost — наружу должен смотреть реверс-прокси
      # с TLS (nginx/Caddy), т.к. Telegram Login Widget и secure-cookie сессии
      # требуют HTTPS. Порт можно сменить через ADMIN_PORT в .env.
      - '127.0.0.1:3001:3001'

  postgres:
    image: postgres:16-alpine
    container_name: vpnoodles-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpnoodles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
     # - '5432:5432'
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vpnoodles-redis
    restart: unless-stopped
    ports:
     # - '6379:6379'
       - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata: